name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [codex/portfolio-foundation, main]
  workflow_dispatch:
  schedule:
    # Hourly polling; GitHub can delay scheduled runs.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule' || vars.WECHAT_SYNC_ENABLED == 'true'
    # Use a trusted runner with a fixed, whitelisted outbound IP for WeChat.
    runs-on: ${{ fromJSON(vars.WECHAT_SYNC_RUNNER_JSON || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync published WeChat articles
        if: vars.WECHAT_SYNC_ENABLED == 'true'
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: npm run sync:wechat
      - name: Verify WeChat sync logic
        run: npm run test:wechat
      - name: Build Astro site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
